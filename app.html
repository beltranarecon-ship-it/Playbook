<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playbook CBP</title>
  <meta name="theme-color" content="#0B0B0D">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icons/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800;900&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    /* Jerarquía tipográfica: Archivo (cuerpo) · Saira Condensed (titulares) · JetBrains Mono (datos) */
    body { font-family: 'Archivo', system-ui, sans-serif; }
    h1, h2, h3, .display, .topbar-brand span { font-family: 'Saira Condensed', 'Arial Narrow', sans-serif; }
    .view-meta, .topbar-avatar { font-family: 'JetBrains Mono', monospace; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "https://esm.sh/@supabase/supabase-js@2": "https://esm.sh/@supabase/supabase-js@2"
    }
  }
  </script>
</head>
<body class="app-layout">

  <div class="speed-bar" aria-hidden="true"></div>

  <!-- ── Topbar ──────────────────────────────────────── -->
  <header class="topbar">
    <a class="topbar-brand" href="/app.html">
      <img src="/assets/icons/logo-cbp.png" alt="CBP"
           onerror="this.style.display='none'" width="30" height="30">
      <span>Playbook CBP</span>
    </a>

    <!-- Los MISMOS cuatro destinos y en el MISMO orden que la otra SPA
         (equipos/js/ui/chrome.js). La biblioteca vive en su propia
         página y por eso tenía su barra a mano, con tres destinos y sin
         Inicio: pasar de una a otra cambiaba la barra de contenido y de
         orden, que es lo que hace que uno deje de fiarse de ella. -->
    <nav class="topbar-nav" aria-label="Navegación principal">
      <a class="nav-item" href="/inicio">Inicio</a>
      <a class="nav-item" href="/sesiones">Calendario</a>
      <a class="nav-item" href="/equipos">Equipos</a>
      <button class="nav-item active" data-view="ejercicios" type="button">Ejercicios</button>
    </nav>

    <div class="topbar-actions">
      <!-- Perfil y salida, igual que en la otra SPA y en el mismo orden:
           se entra al perfil muchas más veces que se cierra sesión. El
           nombre y las iniciales que había aquí están ahora en el
           perfil, que es donde se van a cambiar. -->
      <a class="btn-logout" href="/perfil" title="Tu perfil" aria-label="Tu perfil">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <button class="btn-logout" id="btn-logout" type="button" title="Cerrar sesión" aria-label="Cerrar sesión">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- En móvil la barra de arriba se oculta y manda esta, igual que en
       la SPA de equipos. Sin ella, desde el teléfono la biblioteca era
       un callejón sin salida: no había forma de volver a ningún sitio. -->
  <nav class="eq-tabbar" aria-label="Navegación móvil">
    <a class="eq-tab" href="/inicio" aria-label="Inicio">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Inicio</span>
    </a>
    <a class="eq-tab" href="/sesiones" aria-label="Calendario">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Calendario</span>
    </a>
    <a class="eq-tab" href="/equipos" aria-label="Equipos">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Equipos</span>
    </a>
    <a class="eq-tab active" href="/app.html" aria-label="Ejercicios">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 0v18M3 12h18M5.6 5.6c3 3 3 9.8 0 12.8M18.4 5.6c-3 3-3 9.8 0 12.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Ejercicios</span>
    </a>
  </nav>

  <!-- ── Contenido ───────────────────────────────────── -->
  <main class="app-main">

    <!-- Vista: Ejercicios -->
    <section data-view-panel="ejercicios">
      <div class="view-hero">
        <div class="view-hero-text">
          <span class="eyebrow">Biblioteca</span>
          <h1 class="display view-title">
            <span class="solid">Ejercicios</span>
            <span class="ghost">del club</span>
          </h1>
          <p class="view-meta" id="results-count">Cargando…</p>
        </div>
        <button class="btn btn-primary has-arrow" id="btn-nuevo-ejercicio" type="button">
          Nuevo ejercicio
          <span class="arrow" aria-hidden="true">↗</span>
        </button>
      </div>

      <div class="toolbar">
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
          </svg>
          <input class="search-input" type="search" id="search-ejercicios"
                 placeholder="Buscar ejercicio  /" autocomplete="off">
        </div>

        <!-- Las opciones las rellena app.js DESDE la biblioteca, con el
             número de ejercicios de cada una. Escritas a mano aquí se
             desincronizaban del contenido sin que nadie se enterara: las
             cuatro de tipo no casaban con ningún ejercicio y las de
             categoría dejaban 52 de 97 fuera del alcance del filtro. -->
        <select class="select" id="filter-type" aria-label="Filtrar por tipo">
          <option value="">Todos los tipos</option>
        </select>

        <select class="select" id="filter-category" aria-label="Filtrar por contenido">
          <option value="">Todos los contenidos</option>
        </select>
      </div>

      <div class="exercises-grid" id="exercises-grid"></div>
    </section>

  </main>


  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  </script>

</body>
</html>
