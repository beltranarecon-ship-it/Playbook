<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playbook CBP · Acceso</title>
  <meta name="description" content="Club Baloncesto Palencia · Biblioteca de ejercicios">
  <meta name="theme-color" content="#0B0B0D">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icons/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800;900&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/auth.css">

  <script type="importmap">
  {
    "imports": {
      "https://esm.sh/@supabase/supabase-js@2": "https://esm.sh/@supabase/supabase-js@2"
    }
  }
  </script>
</head>
<body class="auth-page">

  <div class="auth-bg" aria-hidden="true"></div>

  <div class="auth-shell" id="auth-shell">

    <header class="auth-head">
      <div class="auth-logo-row">
        <img src="/assets/icons/logo-cbp.png" alt="Escudo Club Baloncesto Palencia"
             onerror="this.style.display='none'">
        <span class="auth-mark">Club Baloncesto Palencia</span>
      </div>
      <h1 class="auth-title">
        <span class="solid">Playbook</span>
        <span class="ghost">CBP</span>
      </h1>
      <p class="auth-sub">Biblioteca de ejercicios y sesiones del cuerpo técnico. Acceso para entrenadores del club.</p>
    </header>

    <form class="auth-form" id="login-form" novalidate>

      <div id="auth-error" class="auth-error" role="alert" hidden></div>

      <div class="field">
        <label class="field-label-dark" for="email">Correo electrónico</label>
        <input class="input-dark" type="email" id="email" name="email"
               placeholder="entrenador@cbpalencia.es" autocomplete="email" required>
      </div>

      <div class="field">
        <label class="field-label-dark" for="password">Contraseña</label>
        <input class="input-dark" type="password" id="password" name="password"
               placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <label class="remember">
        <input type="checkbox" id="remember" name="remember" checked>
        <span>Recordar este dispositivo</span>
      </label>

      <button type="submit" class="btn-enter" id="btn-login">
        <span class="btn-label">Entrar</span>
        <span class="arrow" aria-hidden="true">→</span>
      </button>

      <!-- Tramo 4.10. Las tres puertas pasan por la misma cerradura: el
           disparador de alta comprueba el correo contra la lista de
           invitaciones (032). Aquí no se comprueba nada, a propósito. -->
      <div class="auth-otros">
        <button type="button" class="btn-google" id="btn-google">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.2a5.3 5.3 0 0 1-2.3 3.5v2.9h3.7c2.2-2 3.4-5 3.4-8.6z"/>
            <path fill="#34A853" d="M12 24c3.1 0 5.7-1 7.6-2.8l-3.7-2.9c-1 .7-2.3 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.8v3c1.9 3.8 5.8 6.3 10.2 6.3z"/>
            <path fill="#FBBC05" d="M5.6 14.7a7.2 7.2 0 0 1 0-4.6v-3H1.8a12 12 0 0 0 0 10.6l3.8-3z"/>
            <path fill="#EA4335" d="M12 4.8c1.7 0 3.2.6 4.4 1.7l3.3-3.3C17.7 1.2 15.1 0 12 0 7.6 0 3.7 2.5 1.8 6.1l3.8 3C6.5 6.7 9 4.8 12 4.8z"/>
          </svg>
          <span>Entrar con Google</span>
        </button>

        <div class="auth-enlaces">
          <button type="button" class="auth-enlace" id="btn-olvido">¿No te acuerdas de la clave?</button>
          <button type="button" class="auth-enlace" id="btn-registro">Tengo invitación y es mi primera vez</button>
        </div>
      </div>

    </form>

    <p class="auth-foot">Playbook CBP v2 · Temporada 2025/26</p>

  </div>

  <script type="module">
    import {
      redirectIfAuthenticated, login, entrarConGoogle, registrarse,
      recuperarClave, mensajeDeAlta,
    } from '/js/auth.js';

    redirectIfAuthenticated();

    const form    = document.getElementById('login-form');
    const emailEl = document.getElementById('email');
    const passEl  = document.getElementById('password');
    const errorEl = document.getElementById('auth-error');
    const btnEl   = document.getElementById('btn-login');
    const shellEl = document.getElementById('auth-shell');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.hidden = false;
      shellEl.classList.remove('animate-shake');
      void shellEl.offsetWidth;
      shellEl.classList.add('animate-shake');
      emailEl.classList.add('error');
      passEl.classList.add('error');
    }

    function clearError() {
      errorEl.hidden = true;
      errorEl.textContent = '';
      errorEl.classList.remove('ok');
      emailEl.classList.remove('error');
      passEl.classList.remove('error');
    }

    function setLoading(loading) {
      btnEl.disabled = loading;
      btnEl.innerHTML = loading
        ? '<span class="btn-spinner"></span><span class="btn-label">Entrando</span>'
        : '<span class="btn-label">Entrar</span><span class="arrow" aria-hidden="true">→</span>';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const email    = emailEl.value.trim();
      const password = passEl.value;

      if (!email || !password) {
        showError('Introduce tu correo y contraseña.');
        return;
      }

      setLoading(true);
      try {
        await login(email, password);
        window.location.replace('/app.html');
      } catch (err) {
        const msg = err.message?.includes('Invalid login credentials')
          ? 'Correo o contraseña incorrectos.'
          : 'No se pudo iniciar sesión. Inténtalo de nuevo.';
        showError(msg);
        setLoading(false);
      }
    });

    [emailEl, passEl].forEach(el => el.addEventListener('input', clearError));

    /* ── Tramo 4.10 ────────────────────────────────────────────
       Un aviso en verde para lo que sale bien; el mismo hueco rojo del
       error para lo que no. Dos cajas distintas para dos cosas
       distintas harían que la de arriba se leyera como un fallo. */
    function showOk(msg) {
      errorEl.textContent = msg;
      errorEl.hidden = false;
      errorEl.classList.add('ok');
    }
    document.getElementById('btn-google').addEventListener('click', async () => {
      clearError();
      try { await entrarConGoogle(); }
      catch (err) { showError(mensajeDeAlta(err)); }
    });

    document.getElementById('btn-olvido').addEventListener('click', async () => {
      clearError();
      const email = emailEl.value.trim();
      if (!email) { showError('Escribe tu correo arriba y vuelve a tocar aquí.'); return; }
      try {
        await recuperarClave(email);
        /* Se dice lo mismo exista o no la cuenta: si el mensaje
           cambiara, cualquiera podría averiguar quién tiene cuenta en
           el club probando correos. */
        showOk('Si ese correo tiene cuenta, te llega un enlace para poner una clave nueva.');
      } catch (err) { showError(mensajeDeAlta(err)); }
    });

    document.getElementById('btn-registro').addEventListener('click', async () => {
      clearError();
      const email = emailEl.value.trim();
      const password = passEl.value;
      if (!email || !password) {
        showError('Escribe tu correo y la contraseña que quieras usar, y vuelve a tocar aquí.');
        return;
      }
      setLoading(true);
      try {
        await registrarse(email, password);
        showOk('Cuenta creada. Si el club te pide confirmar el correo, míralo y vuelve.');
        setLoading(false);
      } catch (err) {
        showError(mensajeDeAlta(err));
        setLoading(false);
      }
    });
  </script>

  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  </script>

</body>
</html>
