[build]
  publish = "."
  functions = "netlify/functions"

# Redirige /app a app.html (permite abrir la URL directa sin 404)
[[redirects]]
  from = "/app"
  to   = "/app.html"
  status = 200

[[redirects]]
  from = "/proyector"
  to   = "/proyector.html"
  status = 200

# Headers de seguridad para todos los archivos
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Cache largo para assets con hash (fonts, icons)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No cachear HTML (siempre fresco)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

# Service Worker nunca cacheado por el browser
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
