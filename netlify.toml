[build]
  publish = "."
  functions = "netlify/functions"

# El escáner de secretos de Netlify avisa cuando el VALOR de una variable
# de entorno aparece en los ficheros publicados. Tres de las nuestras
# aparecen a propósito y no son secretos:
#
#   SUPABASE_URL      la URL del proyecto. Viaja en cada petición que
#                     hace el navegador. Lo que protege los datos es la
#                     RLS, no que esa URL sea desconocida.
#
#   SUPABASE_ANON_KEY la clave anónima. Está en js/config.js y en
#                     taller/js/config.js desde el primer día porque el
#                     navegador la necesita para hablar con Supabase, y
#                     con ella solo se ve lo que las policies dejan ver.
#
#   VAPID_PUBLIC_KEY  pública por definición: el navegador la necesita
#                     para suscribirse a los avisos y viaja dentro de
#                     cada suscripción (Tramo 4.7).
#
# SUPABASE_SERVICE_ROLE y VAPID_PRIVATE_KEY NO se ponen aquí, y es lo
# importante de esta lista: hoy no están en el repositorio, pero el día
# que una se cuele en un commit este escáner es lo único que lo va a
# decir. Silenciarlas sería quedarse sin ese aviso para siempre.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY,VAPID_PUBLIC_KEY"

# Arneses de desarrollo (/dev/*): están en el repo a propósito —abren vistas
# con datos inventados y sin cuenta— pero NO se sirven en producción. El
# propio arnés ya se niega a arrancar fuera de localhost; esto es la segunda
# cerradura, para que la URL ni exista. force: gana a los ficheros estáticos.
[[redirects]]
  from   = "/dev/*"
  to     = "/index.html"
  status = 404
  force  = true

# Redirige /app a app.html (permite abrir la URL directa sin 404)
[[redirects]]
  from = "/app"
  to   = "/app.html"
  status = 200

[[redirects]]
  from = "/proyector"
  to   = "/proyector.html"
  status = 200

# Taller de ejercicios (SPA): todas las rutas /ejercicios/* sirven su index
[[redirects]]
  from = "/ejercicios/*"
  to   = "/taller/index.html"
  status = 200

# Equipos/Sesiones (SPA hermana): /equipos/* y /sesiones/* sirven su index
[[redirects]]
  from = "/equipos"
  to   = "/equipos/index.html"
  status = 200

[[redirects]]
  from = "/equipos/*"
  to   = "/equipos/index.html"
  status = 200

[[redirects]]
  from = "/sesiones"
  to   = "/equipos/index.html"
  status = 200

[[redirects]]
  from = "/sesiones/*"
  to   = "/equipos/index.html"
  status = 200

# Partidos (M6) y dossier (M7): mismas SPA, mismos fallbacks. Sin estas
# reglas, recargar /partidos/:id o /dossier/:id devuelve 404 en producción.
[[redirects]]
  from = "/partidos/*"
  to   = "/equipos/index.html"
  status = 200

[[redirects]]
  from = "/dossier"
  to   = "/equipos/index.html"
  status = 200

[[redirects]]
  from = "/dossier/*"
  to   = "/equipos/index.html"
  status = 200

# Inicio, perfil y administración (Tramos 4.9, 4.10, 4.11): las tres son
# rutas de la MISMA SPA. Sin estas reglas, recargar /inicio en producción
# —que es la pantalla a la que cae todo lo que no se reconoce— devuelve
# 404, y eso deja la app inservible al primer refresco.
[[redirects]]
  from = "/inicio"
  to   = "/equipos/index.html"
  status = 200

[[redirects]]
  from = "/perfil"
  to   = "/equipos/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to   = "/equipos/index.html"
  status = 200

# La página donde cae el enlace de «no me acuerdo de la clave» (4.10)
[[redirects]]
  from = "/clave"
  to   = "/clave.html"
  status = 200

# Headers de seguridad para todos los archivos
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Cache largo para assets con hash (fonts, icons)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No cachear HTML (siempre fresco)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

# Service Worker nunca cacheado por el browser
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
