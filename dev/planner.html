  <!-- ============================================================
       ARNÉS DE DESARROLLO — /dev/planner.html
       Abre el planificador (/sesiones/:id) con una sesión, un equipo,
       una plantilla de bloques y una biblioteca INVENTADOS, sin tocar
       Supabase ni necesitar cuenta. Sirve para trabajar el visor, la
       curva y el picker con datos estables y para probar estados que
       cuesta reproducir a mano (?estado=realizada | cancelada).

       Vive fuera de /equipos a propósito: serve.py y netlify.toml
       reescriben /equipos/* a la SPA, así que aquí dentro no se podría
       servir un HTML suelto.

       NO es parte de la app. Se planta una sesión falsa en el
       localStorage REAL ('cbp-auth'), así que fuera de localhost se
       niega a arrancar: si alguien abriera esto en producción, la app
       de verdad se creería con sesión y fallaría en cada consulta.
       ============================================================ -->
  <script>
  (function () {
    const local = ['localhost', '127.0.0.1', '::1'].includes(location.hostname);
    if (!local) {
      document.documentElement.innerHTML = '<body style="font:16px system-ui;padding:3rem">'
        + 'Arnés de desarrollo. Solo funciona en localhost.</body>';
      throw new Error('dev harness fuera de localhost');
    }
    /* Le dice al limpiador de sesiones (js/sesion-sana.js) que la
       sesión de mentira de aquí abajo es suya y no hay que borrarla:
       el arnés intercepta `fetch`, así que ese token no llega a
       Supabase. Fuera del arnés la bandera no existe y la sesión se
       limpia, que es lo que hace falta al volver a la app de verdad. */
    window.__ARNES_DEV__ = true;

    const AHORA = Math.floor(Date.now() / 1000);
    /* La sesión falsa vive en el localStorage REAL, así que al volver a
       la app de verdad en este mismo navegador seguía ahí y rompía
       todas las consultas. Se marca para poder reconocerla, y la app
       la borra sola al arrancar (js/sesion-sana.js). Aquí además se
       limpia al cerrar la pestaña, que cubre el camino normal. */
    window.addEventListener('pagehide', () => {
      try { localStorage.removeItem('cbp-auth'); } catch { /* da igual */ }
    });
    localStorage.setItem('cbp-auth', JSON.stringify({
      es_del_arnes: true,
      access_token: 'dev', token_type: 'bearer', expires_in: 31536000,
      expires_at: AHORA + 31536000, refresh_token: 'dev',
      user: { id: 'u1', aud: 'authenticated', role: 'authenticated', email: 'dev@local',
              app_metadata: {}, user_metadata: {}, created_at: '2026-01-01T00:00:00Z' },
    }));

    const P = {
      aro: [0.499, 0.091], poste_bajo_izq: [0.376, 0.111], codo_der: [0.622, 0.236],
      base: [0.499, 0.306], esquina_izq: [0.087, 0.08], tiro_libre: [0.499, 0.236],
    };
    const nodo = ([x, y]) => ({ x, y, tipo_nodo: 'lineal' });
    const via = (a, b) => [nodo(a), nodo(b)];

    const ANIM = {
      pista: 'entera', canasta: 'norte',
      jugadores: [
        { id: 'A1', equipo: 'A', tipo: 'atacante', posicion_inicial: P.base, dorsal: 4 },
        { id: 'A5', equipo: 'A', tipo: 'atacante', posicion_inicial: P.esquina_izq, dorsal: 9 },
        { id: 'B1', equipo: 'B', tipo: 'defensor', posicion_inicial: [0.5, 0.24], dorsal: 4 },
      ],
      balones: [{ id: 'b1', posicion_inicial: P.base, portador_id: 'A1' }],
      conos: [{ id: 'c1', posicion: [0.56, 0.27], funcion: 'rodear', fila_config: null }],
      fases: [
        { id: 'f1', duracion_ms: 1100, pausa_post_ms: 300, defensores: ['B1'],

        { id: 'f2', duracion_ms: 900, pausa_post_ms: 250, defensores: ['B1'],
          movimientos: [{ elemento_id: 'A5', tipo_elemento: 'jugador', tipo_movimiento: 'corte', path: via(P.esquina_izq, P.poste_bajo_izq) }],
          pases: [], tiros: [], bloqueos: [] },
        { id: 'f3', duracion_ms: 500, pausa_post_ms: 250, defensores: ['B1'],
          movimientos: [], tiros: [], bloqueos: [],
          pases: [{ id: 'p1', de_id: 'A1', a_id: 'A5', balon_id: 'b1', duracion_ms: 450, path: via(P.codo_der, P.poste_bajo_izq) }] },

            requisitos: { jugadores: 6, balones: 2, conos: 0 },
            animacion: { pista: 'media', canasta: 'norte',
              jugadores: [{ id: 'A1', equipo: 'A', posicion_inicial: [0.75, 0.3], dorsal: 1 },

      e3: { ...BIBLIO[2], dificultad_label: 'Avanzado', duration_max: null, tipo_pista: 'entera',

      e5: { ...BIBLIO[4], dificultad_label: 'Iniciación', duration_max: null, tipo_pista: 'media',

                  pases: [], tiros: [], bloqueos: [] },
                { id: 'f2', duracion_ms: 500, pausa_post_ms: 250, defensores: ['B4', 'B5'],
                  movimientos: [], tiros: [], bloqueos: [],
                  pases: [{ id: 'p1', de_id: 'A1', a_id: 'A3', balon_id: 'b1', path: via([0.499, 0.694], [0.912, 0.92]) }] },
                { id: 'f3', duracion_ms: 800, pausa_post_ms: 400, defensores: ['B4', 'B5'],
                  movimientos: [], pases: [], bloqueos: [],
                  tiros: [{ jugador_id: 'A3', balon_id: 'b1', canasta: 'sur', path: via([0.912, 0.92], [0.499, 0.894]) }] }] } },
    };

    /* La sesión del arnés ocurre AHORA cuando se abre con ?ahora=1
       (Tramo 3.5): es la única forma de ver la pantalla de sesión
       activa, que solo tiene sentido dentro de su hora. */
    const RELOJ = new Date();
    const dos = (n) => String(n).padStart(2, '0');
    const enCurso = new URLSearchParams(location.search).get('ahora') === '1';
    const HOY = `${RELOJ.getFullYear()}-${dos(RELOJ.getMonth() + 1)}-${dos(RELOJ.getDate())}`;
    const HORA_INI = `${dos(RELOJ.getHours())}:${dos(Math.max(0, RELOJ.getMinutes() - 12))}:00`;
    const HORA_FIN = `${dos((RELOJ.getHours() + 1) % 24)}:${dos(RELOJ.getMinutes())}:00`;

    const SESION = {
      id: 'demo', team_id: 't1', season_id: 's1',
      fecha: enCurso ? HOY : '2026-08-22',
      hora_inicio: enCurso ? HORA_INI : '10:00:00',
      hora_fin: enCurso ? HORA_FIN : '11:30:00',

      slot_duracion_min: 90, carga_total: null, notas: null, material: null,

    /* Dos entrenamientos anteriores del mismo equipo, para el aviso
       «esto ya lo hiciste el martes» (Tramo 3.2). El del día 17 repite
       la flecha de tiro; el del 10 queda dentro de la ventana pero más
       lejos, y manda el más reciente. */
    const PREVIAS = [
      { ...SESION, id: 'prev1', fecha: '2026-08-17', estado: 'realizada' },
      { ...SESION, id: 'prev2', fecha: '2026-08-11', estado: 'realizada' },
      /* Una cancelada, para poder comprobar que se puede BORRAR: hasta
         la 033 se quedaba tachada en el calendario para siempre. */

        motivo_cancelacion: 'Pabellón cerrado' },
    ];

    let TABLAS = {

          fecha_nacimiento: null, posicion: null, foto_path: null, notas: null,

    /* Los filtros de PostgREST que usa la app. Estaban dentro del GET;
       hacen falta también en el DELETE, que ya no siempre va por `id`
       (el acta borra por `match_id` + `player_id`). */
    function filtrar(filas, u) {
      for (const [clave, valor] of u.searchParams) {
        if (['select', 'order', 'limit', 'offset', 'on_conflict'].includes(clave)) continue;
        const v = String(valor);
        if (clave.includes('.')) {
          const [t, col] = clave.split('.');
          if (v.startsWith('eq.')) filas = filas.filter((r) => String(r[t]?.[col]) === v.slice(3));
          continue;
        }
        if (v.startsWith('not.is.null')) { filas = filas.filter((r) => r[clave] != null); continue; }
        if (v.startsWith('eq.')) {
          filas = filas.filter((r) => String(r[clave]) === v.slice(3));
        } else if (v.startsWith('in.')) {
          const dentro = new Set(v.slice(3).replace(/^\(|\)$/g, '').split(',').map((x) => x.replace(/^"|"$/g, '')));
          filas = filas.filter((r) => dentro.has(String(r[clave])));
        } else if (v.startsWith('gte.')) {
          filas = filas.filter((r) => String(r[clave]) >= v.slice(4));
        } else if (v.startsWith('lte.')) {
          filas = filas.filter((r) => String(r[clave]) <= v.slice(4));
        } else if (v.startsWith('neq.')) {
          filas = filas.filter((r) => String(r[clave]) !== v.slice(4));
        }
      }
      return filas;
    }

    const SIN028 = new URLSearchParams(location.search).has('sin028');

    const real = window.fetch.bind(window);
    window.fetch = function (entrada, opciones) {
      const url = typeof entrada === 'string' ? entrada : entrada.url;
      const cab = new Headers((opciones && opciones.headers) || (entrada && entrada.headers) || {});

      /* STORAGE. La imagen del equipo (4.12) y el acta viven en buckets
         privados y se piden con una URL firmada. El arnés devuelve un
         PNG de 1x1 en base64 para poder comprobar que el escudo llega
         al chip; un `<img>` no pasa por fetch, así que tiene que ser
         una URL que el navegador pueda cargar sola. */
      if (url.includes('/storage/v1/object/sign/')) {
        const png = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
        console.log('[arnés] storage firma', url.split('/sign/')[1]);
        return Promise.resolve(new Response(JSON.stringify({ signedURL: png }), {
          status: 200, headers: { 'Content-Type': 'application/json' },
        }));
      }

      if (url.includes('/auth/v1/')) {
        /* `getUser()` sí contesta: hay cosas que preguntan quién eres
           antes de escribir —el aviso al otro entrenador (4.13), el
           alta de suscripción push— y sin usuario se quedan a medias
           sin decir por qué. El resto de auth sigue negado. */
        if (url.includes('/auth/v1/user')) {
          return Promise.resolve(new Response(JSON.stringify({
            id: 'u1', aud: 'authenticated', role: 'authenticated', email: 'dev@local',
            app_metadata: {}, user_metadata: {}, created_at: '2026-01-01T00:00:00Z',
          }), { status: 200, headers: { 'Content-Type': 'application/json' } }));
        }
        return Promise.resolve(new Response(JSON.stringify({ error: 'dev' }), { status: 400, headers: { 'Content-Type': 'application/json' } }));
      }
      if (!url.includes('/rest/v1/')) return real(entrada, opciones);

      const u = new URL(url);
      const tabla = u.pathname.split('/rest/v1/')[1].split('?')[0];
      const metodo = ((opciones && opciones.method) || (entrada && entrada.method) || 'GET').toUpperCase();

      /* MIGRACIÓN SIN APLICAR. Con `?sin028` la base de datos responde
         como si la 028 no estuviera: la tabla del acta no existe y las
         columnas nuevas de `matches` tampoco. Sirve para comprobar que
         la pantalla del partido se abre igual —marcador, valoraciones y
         foto— y solo pierde la parte del acta. Una migración pendiente
         no puede dejar a nadie sin el partido del sábado. */
      if (SIN028) {
        const fallo = (estado, cuerpo) => Promise.resolve(new Response(JSON.stringify(cuerpo), {
          status: estado, headers: { 'Content-Type': 'application/json' },
        }));
        if (tabla === 'partido_estadisticas') {
          console.log('[arnés] sin028: no existe partido_estadisticas');
          return fallo(404, { code: '42P01', message: 'relation "public.partido_estadisticas" does not exist' });
        }
        const pedido = (u.searchParams.get('select') || '') + ' ' + ((opciones && opciones.body) || '');
        const nueva = ['periodos', 'faltas_equipo', 'tiempos_muertos', 'acta_origen']
          .find((c) => new RegExp('(^|[^_a-z])' + c + '($|[^_a-z])').test(pedido));
        if (tabla === 'matches' && nueva) {
          console.log('[arnés] sin028: no existe matches.' + nueva);
          return fallo(400, { code: '42703', message: `column matches.${nueva} does not exist` });
        }
      }

      /* ESCRITURAS. El arnés solo leía, y con eso no se puede comprobar
         nada que dependa de haber guardado —como que un vídeo guardado
         se reutilice (Tramo 3.3)—. Se guarda en memoria: se pierde al
         recargar, que para un arnés es exactamente lo que se quiere. */
      if (metodo === 'POST' && TABLAS[tabla]) {
        const cuerpoTxt = (opciones && opciones.body) || '';
        const nuevas = [].concat(JSON.parse(cuerpoTxt || '[]'))
          // `created_at` lo pone la base de datos de verdad; sin él, todo
          // lo que dependa de «cuándo» se cree que no ha pasado nunca
          .map((r, i) => ({ id: `${tabla}_${Date.now()}_${i}`, created_by: 'u1', created_at: new Date().toISOString(), ...r }));
        /* UPSERT. El acta se guarda con `upsert` sobre (match_id,
           player_id): al corregirla el lunes se mandan las MISMAS filas
           con otros números, y un arnés que solo apila las duplica —y
           entonces los totales salen al doble y parece un fallo de la
           app cuando el que miente es el arnés. */
        const choque = (u.searchParams.get('on_conflict') || '').split(',').filter(Boolean);
        if (choque.length) {
          const clave = (r) => choque.map((c) => String(r[c])).join('|');
          const dentro = new Set(nuevas.map(clave));
          TABLAS[tabla] = TABLAS[tabla].filter((r) => !dentro.has(clave(r)));
        }
        TABLAS[tabla].push(...nuevas);
        console.log('[arnés] POST', tabla, choque.length ? '(upsert)' : '', '→', nuevas.length, 'filas');
        return Promise.resolve(new Response(JSON.stringify(nuevas.length === 1 ? nuevas[0] : nuevas), {
          status: 201, headers: { 'Content-Type': 'application/json' },
        }));
      }
      if ((metodo === 'PATCH' || metodo === 'PUT') && TABLAS[tabla]) {
        const idEq = u.searchParams.get('id');
        const id = idEq && idEq.startsWith('eq.') ? idEq.slice(3) : null;
        const patch = JSON.parse((opciones && opciones.body) || '{}');
        const tocadas = [];
        TABLAS[tabla] = TABLAS[tabla].map((r) => {
          if (String(r.id) !== id) return r;
          const n = { ...r, ...patch };
          tocadas.push(n);
          return n;
        });
        console.log('[arnés] PATCH', tabla, id, '→', tocadas.length);
        return Promise.resolve(new Response(JSON.stringify(tocadas), {
          status: 200, headers: { 'Content-Type': 'application/json' },
        }));
      }
      if (metodo === 'DELETE' && TABLAS[tabla]) {
        // por los filtros que traiga, no solo por `id`: el acta borra a
        // los que se quedaron en blanco por match_id + player_id
        const borradas = filtrar(TABLAS[tabla].slice(), u);
        const fuera = new Set(borradas);
        TABLAS[tabla] = TABLAS[tabla].filter((r) => !fuera.has(r));
        console.log('[arnés] DELETE', tabla, u.search, '→', borradas.length);
        /* Se devuelve la LISTA, no el Set: `JSON.stringify(new Set())` es
           `{}`, y media app decide con `data.length` si la policy dejó
           borrar (borrarPartido, retirar una invitación…). Con el Set,
           todas creían que no se había borrado nada aunque sí. */
        return Promise.resolve(new Response(JSON.stringify(borradas), {
          status: 200, headers: { 'Content-Type': 'application/json' },
        }));
      }

      let filas = TABLAS[tabla] ? TABLAS[tabla].slice() : [];

      if (tabla === 'exercises') {
        const idEq = u.searchParams.get('id');
        if (idEq && idEq.startsWith('eq.')) {
          const f = FICHA[idEq.slice(3)];
          filas = f ? [f] : [];
        } else {
          filas = BIBLIO.slice();
        }
      } else {
        /* EMBEBIDOS. `select=...,sessions!inner(fecha,team_id)` trae la
           sesión de cada bloque colgada dentro. Sin esto, la consulta
           de duraciones reales (Tramo 3.6) no devolvía nada en el arnés
           y la propuesta parecía rota cuando lo que faltaba era el
           arnés. Solo se resuelve lo que la app usa de verdad. */
        const select = u.searchParams.get('select') || '';
        if (/sessions!inner\(/.test(select) && TABLAS.sessions) {
          filas = filas
            .map((r) => ({ ...r, sessions: TABLAS.sessions.find((x) => x.id === r.session_id) || null }))
            .filter((r) => r.sessions);
        }

        filas = filtrar(filas, u);
      }

      /* PAGINACIÓN. `leerTodo` (data/_client.js) pide páginas con
         `offset`/`limit` hasta que una viene VACÍA. Un arnés que los
         ignore devuelve siempre las mismas filas y el bucle no termina
         nunca: la pestaña se cuelga sin decir por qué, y el aviso que
         se estaba probando simplemente no aparece.

         Salió al añadir el aviso de «esto ya lo hiciste» (Tramo 3.2),
         que lee los bloques de varias sesiones de una tacada. */
      const desplazamiento = Number(u.searchParams.get('offset')) || 0;
      const tope = Number(u.searchParams.get('limit'));
      if (desplazamiento) filas = filas.slice(desplazamiento);
      if (Number.isFinite(tope) && tope > 0) filas = filas.slice(0, tope);

      console.log('[arnés]', tabla, u.search, '→', filas.length, 'filas');
      const objeto = (cab.get('Accept') || '').includes('pgrst.object');
      const cuerpo = objeto ? (filas[0] ?? null) : filas;

      /* RECUENTOS. `select('id', { count: 'exact', head: true })` pide el
         número de filas y lo recibe en la cabecera `Content-Range`, no en
         el cuerpo. Sin ella, `data.count` llega nulo, y lo que decide si
         se puede borrar una temporada o un equipo es justamente ese
         número: el arnés decía «no sé cuántos hay» a algo que sí sabe. */
      const cabeceras = { 'Content-Type': 'application/json' };
      if ((cab.get('Prefer') || '').includes('count=')) {
        cabeceras['Content-Range'] = `0-${Math.max(0, filas.length - 1)}/${filas.length}`;
      }
      return Promise.resolve(new Response(JSON.stringify(cuerpo), {
        status: 200, headers: cabeceras,
      }));
    };

    /* La ruta que se abre. Por defecto el planificador, que es para lo
       que nació el arnés; con `?ruta=/partidos/m1` se abre el partido
       del sábado (Tramo 4.1) con los mismos datos falsos. */
    history.replaceState({}, '', new URLSearchParams(location.search).get('ruta') || '/sesiones/demo');
  })();
  </script>
