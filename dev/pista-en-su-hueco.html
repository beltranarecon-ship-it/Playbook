<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>La pista dentro de su hueco</title>
<!--
  Arnés de comprobación (dev). NO se sirve en producción.

  Monta CourtView de verdad, con el CSS de verdad, dentro de una columna
  del ancho que tiene en el Taller. Sirve para ver si alguna pista se
  sale de su hueco: la regla de escritorio de canvas.css fija el ALTO y
  deja el ancho libre, y eso se escribió cuando todas las pistas eran
  verticales. Las del dibujo nuevo no lo son: media es 18×18 (cuadrada)
  y media_fiba 17×18.

  Abajo, las mismas cuatro en modo proyector (rotate 90), que es donde
  el ancho se calcula con 297/210 escrito a mano.
-->
<link rel="stylesheet" href="/taller/css/tokens.css">
<link rel="stylesheet" href="/taller/css/base.css">
<link rel="stylesheet" href="/taller/css/canvas.css">
<style>
  body { background:#0f1115; color:#dde; font:13px/1.5 system-ui,sans-serif; margin:0; padding:1rem }
  .rejilla { display:flex; gap:1.6rem; flex-wrap:wrap; align-items:flex-start; margin-bottom:2rem }
  /* el hueco real del lienzo en el Taller: 1.15fr de un --maxw de 1480 */
  .columna { width:775px; outline:1px dashed #e33; outline-offset:2px; position:relative }
  .columna::after { content:attr(data-nombre); position:absolute; top:-1.15rem; left:0; font:11px ui-monospace,monospace; color:#e33 }
  h1 { font-size:.95rem; text-transform:uppercase; letter-spacing:.05em; color:#9ab; margin:0 0 1.5rem }
  h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; color:#9ab; margin:0 0 1.5rem }
  #informe { font-family:ui-monospace,monospace; white-space:pre; margin-top:1rem; color:#8fb; font-size:12px }
</style>
</head>
<body>
<h1>La pista dentro de su hueco · columna de 775 px en rojo</h1>
<div class="rejilla" id="normal"></div>
<h2>Modo proyector (girado 90°)</h2>
<div class="rejilla" id="girado"></div>
<div id="informe"></div>
<script type="module">
import { CourtView, PISTAS } from '/taller/js/canvas/court.js';

const montadas = [];
for (const [zona, rotate] of [['normal', 0], ['girado', 90]]) {
  const donde = document.getElementById(zona);
  for (const k of Object.keys(PISTAS)) {
    const col = document.createElement('div');
    col.className = 'columna';
    col.dataset.nombre = `${k}${rotate ? ' · girada' : ''}`;
    const wrap = document.createElement('div');
    wrap.className = 'court-wrap';
    const v = new CourtView({ pista: k, rotate });
    wrap.appendChild(v.root); col.appendChild(wrap); donde.appendChild(col);
    montadas.push({ k, rotate, v, col });
  }
}

window.medir = () => {
  const filas = montadas.map(({ k, rotate, v, col }) => {
    const c = v.root.getBoundingClientRect(), h = col.getBoundingClientRect();
    const cs = getComputedStyle(v.root);
    return {
      pista: k + (rotate ? '·girada' : ''),
      aspect: cs.getPropertyValue('--court-aspect').trim(),
      bg: cs.getPropertyValue('--court-bg-aspect').trim(),
      ancho: +c.width.toFixed(0), alto: +c.height.toFixed(0),
      hueco: +h.width.toFixed(0),
      desborde: +(c.width - h.width).toFixed(0),
    };
  });
  document.getElementById('informe').textContent = filas.map((f) =>
    `${f.pista.padEnd(20)} aspect ${f.aspect.slice(0, 8).padEnd(9)} bg ${f.bg.slice(0, 8).padEnd(9)}`
    + `${String(f.ancho).padStart(6)} x ${String(f.alto).padStart(4)} px  hueco ${f.hueco}  `
    + (f.desborde > 1 ? `SE SALE ${f.desborde} px` : 'cabe')).join('\n');
  return filas;
};
setTimeout(window.medir, 200);
</script>
</body>
</html>
