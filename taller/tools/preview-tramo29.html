<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harness manual · Tramo 2.9 (paso 2 por fases) — solo desarrollo</title>
  <link rel="stylesheet" href="/taller/css/tokens.css">
  <link rel="stylesheet" href="/taller/css/base.css">
  <link rel="stylesheet" href="/taller/css/canvas.css">
  <link rel="stylesheet" href="/taller/css/anim.css">
  <link rel="stylesheet" href="/taller/css/wizard.css">
  <style>
    body { font-family: 'Hanken Grotesk', system-ui, sans-serif; padding: 16px; background: #DFE8F0; }
    .harness { display: grid; grid-template-columns: 520px 1fr; gap: 24px; align-items: start; }
    .harness .court-wrap { max-width: 520px; }
  </style>
</head>
<body>
  <div class="harness">
    <div id="panel"></div>
    <div id="courtHost"></div>
  </div>
  <script type="module">
    /* Harness manual del Tramo 2.9: monta el Stage y el paso 2 REALES sin el
       guard de sesión, para poder comprobar el paso entero en desarrollo.
       El tablero es el del criterio de aceptación: una fila de 6 con rondas
       y un balón, que es el ejercicio de fila de toda la vida. */
    import { Stage } from '/taller/js/canvas/stage.js';
    import { paso2 } from '/taller/js/wizard/paso2.js';
    import { nuevoDraft } from '/taller/js/wizard/draft.js';

    const stage = new Stage({ pista: 'media' });
    document.getElementById('courtHost').append(stage.el);

    const cono = stage.board.add({ kind: 'cono' }, 0.86, 0.30);
    cono.funcion = 'fila';
    cono.fila_config = { n_jugadores: 6, direccion_grados: 180, equipo: 'A', rondas: true, cadencia_s: null, rol: 'atacante' };
    stage.board.add({ kind: 'balon' }, 0.84, 0.30);
    stage.board.add({ kind: 'jugador', equipo: 'B' }, 0.42, 0.30);
    stage.board.add({ kind: 'cono' }, 0.60, 0.22).funcion = 'rodear';

    const draft = nuevoDraft();
    draft.tipo_pista = 'media';
    draft.nombre = 'Harness 2.9';

    const paso = paso2({ draft, stage, onDraftChange: () => {}, toast: (m) => console.log('[toast]', m) });
    document.getElementById('panel').append(paso.el);

    window.__stage = stage;
    window.__draft = draft;
    window.__paso = paso;
  </script>
</body>
</html>
